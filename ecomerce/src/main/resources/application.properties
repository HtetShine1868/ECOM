# ─── Application ───────────────────────────────────────────
spring.application.name=ecomerce

# ─── Server ─────────────────────────────────────────────────
server.port=8080
server.forward-headers-strategy=NATIVE

# ─── Database (Supabase / PostgreSQL) ───────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── JWT ────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ─── Supabase Storage ────────────────────────────────────────
app.supabase.url=${SUPABASE_URL}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
app.supabase.bucket=product_image

# ─── OAuth2 – Google ─────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=https://ecommercebe-xhhj.onrender.com/login/oauth2/code/google

# ─── OAuth2 – Facebook ───────────────────────────────────────
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:PLACEHOLDER}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:PLACEHOLDER}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri=https://ecommercebe-xhhj.onrender.com/login/oauth2/code/facebook

# Override Facebook provider endpoints (Spring default v2.8 is dead)
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v19.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v19.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/v19.0/me?fields=id,name,email,picture
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

app.cors.allowed-origins=${FRONTEND_URL}

# ─── Admin Bootstrap ─────────────────────────────────────────
app.admin.email=${ADMIN_EMAIL:admin@shop.com}
app.admin.password=${ADMIN_PASSWORD:Admin@1234}

# ─── File Upload ─────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ─── Actuator ────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
