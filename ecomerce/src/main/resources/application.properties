# ─── Application ───────────────────────────────────────────
spring.application.name=ecomerce

# ─── Server ─────────────────────────────────────────────────
server.port=8080
server.forward-headers-strategy=NATIVE

# ─── Database (Supabase / PostgreSQL) ───────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Supabase session pooler allows 15 clients total. Keep this small so a
# local run and a Render deploy can both connect.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

# ─── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Creates additive tables such as notifications before Hibernate validates the schema.
spring.sql.init.mode=always

# ─── JWT ────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ─── Supabase Storage ────────────────────────────────────────
app.supabase.url=${SUPABASE_URL}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
app.supabase.bucket=product_image

# ─── OAuth2 – Google ─────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${BACKEND_URL:https://ecom-d3vm.onrender.com}/login/oauth2/code/google

# ─── OAuth2 – Facebook ───────────────────────────────────────
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:PLACEHOLDER}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:PLACEHOLDER}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri=${BACKEND_URL:https://ecom-d3vm.onrender.com}/login/oauth2/code/facebook


spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v19.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v19.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/v19.0/me?fields=id,name,email,picture
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

app.cors.allowed-origins=${FRONTEND_URL:https://ecom-chi-taupe.vercel.app}
app.oauth2.frontend-url=${FRONTEND_URL:https://ecom-chi-taupe.vercel.app}
app.oauth2.allowed-redirects=${OAUTH_ALLOWED_REDIRECTS:http://localhost:5173,http://127.0.0.1:5173}

# OAuth handshake cookie. Lax is sent on the top-level return from Google/Facebook.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# ─── Admin Bootstrap ─────────────────────────────────────────
# No defaults. Startup fails if the first admin must be created without these.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ─── File Upload ─────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
# Tomcat's default post limit is 2MB and answers with an HTML error page.
server.tomcat.max-http-form-post-size=12MB
server.tomcat.max-swallow-size=12MB

# ─── Actuator ────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Redis is an optional dependencies. Its outage must not mark the
# whole service DOWN (Render would restart it). Its state is reported on the
# admin-only /api/admin/system/status endpoint instead.
management.health.redis.enabled=false

# ─── Request correlation / logging ───────────────────────────
logging.pattern.level=%5p [rid=%X{requestId:-}]

# X-Forwarded-For is honoured only when the direct peer is a trusted proxy.
# Tomcat's default trusted set is private/loopback/CGNAT ranges (Render's internal
# proxies), so a client cannot spoof its IP by sending the header itself.

# ─── Redis (optional: cache, cart, shared rate limits) ───────
# REDIS_ENABLED: true | false | auto (auto = enabled when REDIS_URL is set)
app.redis.enabled=${REDIS_ENABLED:auto}
# Full URL takes priority: redis://user:password@host:port or rediss://... for TLS
app.redis.url=${REDIS_URL:}
app.redis.host=${REDIS_HOST:localhost}
app.redis.port=${REDIS_PORT:6379}
app.redis.password=${REDIS_PASSWORD:}
app.redis.ssl=${REDIS_SSL:false}
app.redis.connect-timeout-ms=${REDIS_CONNECT_TIMEOUT_MS:2000}
app.redis.command-timeout-ms=${REDIS_COMMAND_TIMEOUT_MS:1000}
# After a Redis error, skip Redis for this long before trying again.
app.redis.circuit-open-seconds=${REDIS_CIRCUIT_OPEN_SECONDS:30}

spring.data.redis.repositories.enabled=false

# ─── Cache TTLs ──────────────────────────────────────────────
app.cache.ttl.product-seconds=${CACHE_TTL_PRODUCT_SECONDS:300}
app.cache.ttl.category-seconds=${CACHE_TTL_CATEGORY_SECONDS:600}
app.cache.ttl.listing-seconds=${CACHE_TTL_LISTING_SECONDS:120}

# ─── Cart ────────────────────────────────────────────────────
app.cart.ttl-days=${CART_TTL_DAYS:7}
app.cart.max-quantity-per-item=${CART_MAX_QTY_PER_ITEM:99}
app.cart.max-distinct-items=${CART_MAX_DISTINCT_ITEMS:50}

# ─── Checkout idempotency ────────────────────────────────────
# A PROCESSING record older than this is treated as abandoned (crashed request).
app.idempotency.processing-timeout-seconds=${IDEMPOTENCY_PROCESSING_TIMEOUT_SECONDS:120}

# ─── Outbox Publisher ────────────────────────────────────────
app.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:3000}
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:20}
app.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:8}
app.outbox.backoff-base-seconds=${OUTBOX_BACKOFF_BASE_SECONDS:5}
app.outbox.backoff-max-seconds=${OUTBOX_BACKOFF_MAX_SECONDS:600}

# ─── Rate Limiting (fixed window, shared via Redis) ──────────
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.auth.max-requests=${RATE_LIMIT_AUTH_MAX:20}
app.rate-limit.auth.window-seconds=${RATE_LIMIT_AUTH_WINDOW_SECONDS:900}
app.rate-limit.auth-account.max-requests=${RATE_LIMIT_AUTH_ACCOUNT_MAX:8}
app.rate-limit.auth-account.window-seconds=${RATE_LIMIT_AUTH_ACCOUNT_WINDOW_SECONDS:900}
app.rate-limit.checkout.max-requests=${RATE_LIMIT_CHECKOUT_MAX:10}
app.rate-limit.checkout.window-seconds=${RATE_LIMIT_CHECKOUT_WINDOW_SECONDS:60}
app.rate-limit.cart.max-requests=${RATE_LIMIT_CART_MAX:90}
app.rate-limit.cart.window-seconds=${RATE_LIMIT_CART_WINDOW_SECONDS:60}
app.rate-limit.search.max-requests=${RATE_LIMIT_SEARCH_MAX:150}
app.rate-limit.search.window-seconds=${RATE_LIMIT_SEARCH_WINDOW_SECONDS:60}
app.rate-limit.product.max-requests=${RATE_LIMIT_PRODUCT_MAX:400}
app.rate-limit.product.window-seconds=${RATE_LIMIT_PRODUCT_WINDOW_SECONDS:60}
app.rate-limit.admin.max-requests=${RATE_LIMIT_ADMIN_MAX:600}
app.rate-limit.admin.window-seconds=${RATE_LIMIT_ADMIN_WINDOW_SECONDS:60}
app.rate-limit.chat.max-requests=${RATE_LIMIT_CHAT_MAX:30}
app.rate-limit.chat.window-seconds=${RATE_LIMIT_CHAT_WINDOW_SECONDS:60}

# Statements in schema.sql end with ";;" so DO $$ blocks (which contain ";") are not split.
spring.sql.init.separator=;;

# ─── AI shop assistant (Gemini) ──────────────────────────────
# The chat uses Gemini when GEMINI_API_KEY is set; otherwise (or if every model
# fails) it falls back to the built-in rule-based assistant.
app.ai.gemini.api-key=${GEMINI_API_KEY:}
# Tried in order; a model that is overloaded / out of quota is skipped for a minute.
app.ai.gemini.models=${GEMINI_MODELS:gemini-3.8-flash,gemini-3.7-flash,gemini-3.5-flash,gemini-3.5-flash-lite}
app.ai.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:25}
app.ai.gemini.max-tool-rounds=${GEMINI_MAX_TOOL_ROUNDS:5}
