# ─── Application ───────────────────────────────────────────
spring.application.name=ecomerce

# ─── Server ─────────────────────────────────────────────────
server.port=8080
server.forward-headers-strategy=NATIVE

# ─── Database (Supabase / PostgreSQL) ───────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Creates additive tables such as notifications before Hibernate validates the schema.
spring.sql.init.mode=always

# ─── JWT ────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ─── Supabase Storage ────────────────────────────────────────
app.supabase.url=${SUPABASE_URL}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
app.supabase.bucket=product_image

# ─── OAuth2 – Google ─────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${BACKEND_URL:https://ecom-d3vm.onrender.com}/login/oauth2/code/google

# ─── OAuth2 – Facebook ───────────────────────────────────────
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:PLACEHOLDER}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:PLACEHOLDER}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri=${BACKEND_URL:https://ecom-d3vm.onrender.com}/login/oauth2/code/facebook

# Override Facebook provider endpoints (Spring default v2.8 is dead)
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v19.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v19.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/v19.0/me?fields=id,name,email,picture
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

app.cors.allowed-origins=${FRONTEND_URL:https://ecom-chi-taupe.vercel.app}
app.oauth2.frontend-url=${FRONTEND_URL:https://ecom-chi-taupe.vercel.app}
app.oauth2.allowed-redirects=${OAUTH_ALLOWED_REDIRECTS:http://localhost:5173,http://127.0.0.1:5173}

# OAuth handshake cookie. Lax is sent on the top-level return from Google/Facebook.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# ─── Admin Bootstrap ─────────────────────────────────────────
# No defaults. Startup fails if the first admin must be created without these.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ─── File Upload ─────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
# Tomcat's default post limit is 2MB and answers with an HTML error page.
server.tomcat.max-http-form-post-size=12MB
server.tomcat.max-swallow-size=12MB

# ─── Actuator ────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
